<div id="popup"></div>

<script>
  const districtInfo = {
    "Jaffna": "Population: 600,000<br>Famous: Nallur Temple",
    "Kilinochchi": "Agriculture Hub<br>Population: 120,000",
    "Mullaitivu": "Coastal District<br>Fishing Economy",
    "Mannar": "Island District<br>Wind Power Zone",
    "Vavuniya": "Transport Gateway<br>Growing City"
  };

  // Select all paths
  document.querySelectorAll("svg path").forEach(path => {
    path.addEventListener("click", () => {
      const name = path.getAttribute("title");
      const popup = document.getElementById("popup");
      popup.style.display = "block";
      popup.innerHTML = `
        <h3>${name}</h3>
        <p>${districtInfo[name] || "No data yet"}</p>
        <button onclick="document.getElementById('popup').style.display='none'">Close</button>
      `;
    });
  });
</script>
